<img src="img/cover.jpg"><h1>靈幻之鑰｜有聲書</h1><p>《靈幻之鑰》有聲書。高二開學換座位，我抽到班花沈芷瑜的隔壁。舊圖書館大掃除那天，我們的手同時碰到一把古銅色的鑰匙——醒來時，頭頂有三個月亮。台灣高中校園 × 青春戀愛 × 異世界冒險：淡水的夕陽、劍與魔法、三十公尺的距離。</p><p>RSS：<a href="feed.xml">https://ntcloudy.github.io/linghuan-podcast/feed.xml</a></p><ol></ol>
